[Unit]
# ODIN: 等 odin-touchscreen.service 把触摸 event node 绑定好之后再启动 buffyboard。
#
# 真因（2026-10-20 真机定位，参见 reports/050）：
# buffyboard 走的是 libinput **path 模式**（libinput_path_add_device，没有 udev
# seat 模式），只在**启动时扫一次 /dev/input**，之后永不重扫、不支持热插拔；
# 连 odin-buffyboard-redraw 每 2 秒的 SIGUSR1 也只触发 lv_obj_invalidate 重绘，
# 不补扫输入设备。
# 而 FT8716 是 TDDI（触摸与显示同一颗芯片），内核首次 probe 必失败
# （-5/EIO），要等 odin-touchscreen.service 里 modprobe 重新 probe 后
# /dev/input/event5 才出现。两个 unit 并跑时 buffyboard 抢先 ~2 秒完成扫描
# ⇒ event5 整个会话都进不了 buffyboard 的设备列表（epoll 里也没有它），
# 触摸对屏上键盘完全无效。内核侧自己是好的（evtest 直读 event5 事件齐全）。
#
# After= 对 Type=oneshot 意味着 buffyboard 会等 odin-touchscreen 跑完
# ExecStart 才启动，扫描时 event5 已就位 ⇒ 摸得到。
# 注意不要改成 Requires=/BindsTo=：odin-touchscreen 万一失败（比如等不到
# 显示链）也不该挡住 buffyboard 起来（屏和残存的输入还是要的）。
#
# 想当年哪些启动有运气赶上：buffyboard 启动晚于触摸 rebind 的开机，
# 触摸就正常 —— 这就是"之前是好的、现在突然不能摸"的来源，纯竞态。
After=odin-touchscreen.service
